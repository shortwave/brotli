name: JNI release
on:
  pull_request:
  release:
    types:
      - created
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build JNI release assets
    permissions:
      contents: write # Upload release assets; pull requests only build.
    strategy:
      matrix:
        name: [ linux_x64, macos_arm64 ]
        include:
          - os: ubuntu-latest
            name: linux_x64
          - os: macOS-latest
            name: macos_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          ARTIFACT_PLATFORM: ${{ matrix.name }}
        run: |
          bazelisk build -c opt --java_language_version=17 --java_runtime_version=remotejdk_17 //org/brotli/wrapper:wrapper_deploy.jar
          bazelisk build -c opt --java_language_version=17 --java_runtime_version=remotejdk_17 //org/brotli/wrapper:native
          mv ./bazel-bin/org/brotli/wrapper/wrapper_deploy.jar ../brotli.jar
          mv ./bazel-bin/org/brotli/wrapper/native.jar "../brotli-native-${ARTIFACT_PLATFORM}.jar"
        working-directory: ./java
      - name: Upload Assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARTIFACT_PLATFORM: ${{ matrix.name }}
        run: gh release upload "$RELEASE_TAG" brotli.jar "brotli-native-${ARTIFACT_PLATFORM}.jar"
