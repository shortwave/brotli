name: JNI release build
on:
  pull_request:
  release:
    types:
      - created
permissions:
  contents: read
jobs:
  build:
    name: Build and test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux_x64
          - os: macos-15-intel
            name: macos_x64
          - os: macos-15
            name: macos_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test decoder and compression compatibility
        run: make -j2 test
      - name: Build JNI release assets
        run: |
          bazel build --noenable_bzlmod -c opt //org/brotli/wrapper:wrapper_deploy.jar //org/brotli/wrapper:native
          mkdir -p ../artifacts
          cp ./bazel-bin/org/brotli/wrapper/wrapper_deploy.jar ../artifacts/brotli.jar
          cp ./bazel-bin/org/brotli/wrapper/native.jar ../artifacts/brotli-native-${{ matrix.name }}.jar
        working-directory: ./java
      - name: Test JNI wrapper
        run: bazel test --noenable_bzlmod -c opt //org/brotli/wrapper/dec:CornerCasesTest //org/brotli/wrapper/dec:DecoderTest
        working-directory: ./java
      - name: Preserve release assets
        uses: actions/upload-artifact@v4
        with:
          name: brotli-${{ matrix.name }}
          path: artifacts/*.jar
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: brotli-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
